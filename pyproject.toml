[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sogh-collab"
version = "0.1.0"
description = "SOGH-collab QA/verification tooling (Claude Code's independent track)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.verify" = ["data/*.json"]  # the fact_key registry

[tool.pytest.ini_options]
testpaths = ["tests"]
